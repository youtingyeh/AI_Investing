name: Daily AI Supply Chain & Market Data Update

on:
  schedule:
    # 每日台北時間早上 07:30 自動執行 (UTC 23:30)
    - cron: '30 23 * * *'
  workflow_dispatch: # 支援手動一鍵觸發更新

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Scraping & Cleaning Script
        run: |
          python update_data.py

      - name: Commit and Push Updated data.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json
          git diff --staged --quiet || (git commit -m "chore(data): automated daily AI supply chain sync [skip ci]" && git push)
